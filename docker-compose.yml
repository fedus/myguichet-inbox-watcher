name: document-inbox-watcher

services:
  document-watcher:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: document-watcher

    env_file:
      - path: .env
        required: false
    environment:
      DOCUMENT_RUN_MODE: ${DOCUMENT_RUN_MODE:-poll}
      DOCUMENT_API_HOST: ${DOCUMENT_API_HOST:-0.0.0.0}
      DOCUMENT_API_PORT: ${DOCUMENT_API_PORT:-8000}
    # DOCUMENT_RUN_MODE values: poll, mqtt, api, watcher. "watcher" runs the
    # read-only API and MQTT subscriber in the same container.

    ports:
      - "${DOCUMENT_API_PORT:-8000}:${DOCUMENT_API_PORT:-8000}"

    volumes:
      - document-watcher-accounts:/app/accounts
      - ./downloads:/app/downloads

    restart: "no"
    stop_grace_period: 45s

    security_opt:
      - no-new-privileges:true

volumes:
  document-watcher-accounts:
