services:
  document-watcher:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: document-watcher

    env_file:
      - .env
    # Set DOCUMENT_RUN_MODE=mqtt in .env to keep this container subscribed to
    # the configured broker instead of running one poll and exiting.

    volumes:
      - document-watcher-data:/app
      - ./downloads:/app/downloads

    working_dir: /app

    restart: "no"

    security_opt:
      - no-new-privileges:true

volumes:
  document-watcher-data:
