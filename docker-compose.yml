name: document-inbox-watcher

services:
  document-watcher:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: document-watcher

    env_file:
      - .env
    environment:
      DOCUMENT_RUN_MODE: ${DOCUMENT_RUN_MODE:-poll}
    # Set DOCUMENT_RUN_MODE=mqtt in .env to keep this container subscribed to
    # the configured broker instead of running one poll and exiting.

    volumes:
      - document-watcher-accounts:/app/accounts
      - ./downloads:/app/downloads

    restart: "no"

    security_opt:
      - no-new-privileges:true

volumes:
  document-watcher-accounts:
